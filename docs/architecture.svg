<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 840" role="img" aria-label="Diagram of a single event's path: HTTP ingestion, idempotency check via a unique Postgres constraint, retry loop with backoff and jitter, publishing to the dead-letter queue, and replay back into the raw-events topic.">
  <title>Resilient Event Processor — Architecture</title>
  <rect width="940" height="840" fill="#ffffff"></rect>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b1e24"></path>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a90a0"></path>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5fac"></path>
    </marker>
  </defs>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <!-- legend -->
    <line x1="700" y1="18" x2="730" y2="18" stroke="#2f5fac" stroke-width="2" marker-end="url(#arrow-accent)"></line>
    <text x="736" y="22" font-family="system-ui, sans-serif" font-size="11" fill="#2f5fac">resilience mechanism</text>

    <!-- feedback loop: replay -> raw-events -->
    <path d="M140,782 L10,782 L10,8 L490,8 L490,30" fill="none" stroke="#2f5fac" stroke-width="2" marker-end="url(#arrow-accent)"></path>
    <text x="250" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#2f5fac">replay → republishes to raw-events</text>

    <!-- Row 1: ingestion -->
    <rect x="20" y="30" width="150" height="56" rx="10" fill="#ffffff" stroke="#1b1e24" stroke-width="1.4"></rect>
    <text x="95" y="63" text-anchor="middle" font-size="12" font-weight="600" fill="#1b1e24">HTTP Client</text>

    <rect x="190" y="30" width="150" height="56" rx="10" fill="#ffffff" stroke="#1b1e24" stroke-width="1.4"></rect>
    <text x="265" y="63" text-anchor="middle" font-size="12" font-weight="600" fill="#1b1e24">POST /events</text>

    <rect x="390" y="30" width="200" height="56" rx="10" fill="#ffffff" stroke="#1b1e24" stroke-width="1.4"></rect>
    <text x="490" y="63" text-anchor="middle" font-size="12" font-weight="600" fill="#1b1e24">Kafka: raw-events</text>

    <line x1="170" y1="58" x2="187" y2="58" stroke="#1b1e24" stroke-width="1.4" marker-end="url(#arrow)"></line>
    <text x="178" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#626a78">event</text>

    <line x1="340" y1="58" x2="387" y2="58" stroke="#1b1e24" stroke-width="1.4" marker-end="url(#arrow)"></line>
    <text x="363" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#626a78">publish</text>

    <path d="M265,86 C265,112 95,112 95,86" fill="none" stroke="#8a90a0" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#arrow-muted)"></path>
    <text x="180" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#626a78">202 Accepted</text>

    <!-- Row 2: worker pool -->
    <rect x="380" y="146" width="220" height="56" rx="10" fill="#ffffff" stroke="#1b1e24" stroke-width="1.4"></rect>
    <text x="490" y="171" text-anchor="middle" font-size="12" font-weight="600" fill="#1b1e24">Worker Pool</text>
    <text x="490" y="187" text-anchor="middle" font-size="12" fill="#1b1e24">(N goroutines)</text>

    <line x1="490" y1="86" x2="490" y2="143" stroke="#1b1e24" stroke-width="1.4" marker-end="url(#arrow)"></line>
    <text x="500" y="118" font-family="system-ui, sans-serif" font-size="11" fill="#626a78">consume</text>

    <!-- Row 3: idempotency check (accent) + discard branch -->
    <rect x="380" y="262" width="220" height="64" rx="10" fill="#ffffff" stroke="#2f5fac" stroke-width="2"></rect>
    <text x="490" y="286" text-anchor="middle" font-size="12" font-weight="600" fill="#2f5fac">INSERT processed_events</text>
    <text x="490" y="302" text-anchor="middle" font-size="12" fill="#2f5fac">PK = event_id</text>

    <rect x="660" y="266" width="230" height="56" rx="10" fill="#ffffff" stroke="#1b1e24" stroke-width="1.4"></rect>
    <text x="775" y="299" text-anchor="middle" font-size="12" fill="#1b1e24">duplicate → discard (ack)</text>

    <line x1="490" y1="202" x2="490" y2="259" stroke="#1b1e24" stroke-width="1.4" marker-end="url(#arrow)"></line>
    <text x="500" y="234" font-family="system-ui, sans-serif" font-size="11" fill="#626a78">check idempotency</text>

    <line x1="600" y1="294" x2="657" y2="294" stroke="#1b1e24" stroke-width="1.4" marker-end="url(#arrow)"></line>
    <text x="628" y="286" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#626a78">duplicate</text>

    <line x1="490" y1="326" x2="490" y2="413" stroke="#1b1e24" stroke-width="1.4" marker-end="url(#arrow)"></line>
    <text x="500" y="372" font-family="system-ui, sans-serif" font-size="11" fill="#626a78">new</text>

    <!-- Row 4: process + ack + retry loop (accent) -->
    <rect x="380" y="416" width="220" height="56" rx="10" fill="#ffffff" stroke="#1b1e24" stroke-width="1.4"></rect>
    <text x="490" y="441" text-anchor="middle" font-size="12" font-weight="600" fill="#1b1e24">process()</text>
    <text x="490" y="457" text-anchor="middle" font-size="12" fill="#1b1e24">business logic</text>

    <rect x="660" y="416" width="230" height="56" rx="10" fill="#ffffff" stroke="#1b1e24" stroke-width="1.4"></rect>
    <text x="775" y="448" text-anchor="middle" font-size="12" fill="#1b1e24">ack + commit offset</text>

    <line x1="600" y1="444" x2="657" y2="444" stroke="#1b1e24" stroke-width="1.4" marker-end="url(#arrow)"></line>
    <text x="628" y="436" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#626a78">success</text>

    <line x1="775" y1="322" x2="775" y2="413" stroke="#1b1e24" stroke-width="1.4" marker-end="url(#arrow)"></line>
    <text x="785" y="372" font-family="system-ui, sans-serif" font-size="11" fill="#626a78">ack</text>

    <path d="M400,472 C330,472 330,416 400,416" fill="none" stroke="#2f5fac" stroke-width="2" marker-end="url(#arrow-accent)"></path>
    <text x="195" y="438" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#2f5fac">retry: backoff + jitter</text>
    <text x="195" y="452" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#2f5fac">(≤ N attempts)</text>

    <!-- Row 5: DLQ topic (accent) -->
    <rect x="380" y="532" width="220" height="56" rx="10" fill="#ffffff" stroke="#2f5fac" stroke-width="2"></rect>
    <text x="490" y="565" text-anchor="middle" font-size="12" font-weight="600" fill="#2f5fac">Kafka: events-dlq</text>

    <line x1="490" y1="472" x2="490" y2="529" stroke="#2f5fac" stroke-width="2" marker-end="url(#arrow-accent)"></line>
    <text x="500" y="504" font-family="system-ui, sans-serif" font-size="11" fill="#2f5fac">retries exhausted</text>

    <!-- Row 6: DLQ consumer + table -->
    <rect x="350" y="648" width="280" height="56" rx="10" fill="#ffffff" stroke="#1b1e24" stroke-width="1.4"></rect>
    <text x="490" y="673" text-anchor="middle" font-size="12" font-weight="600" fill="#1b1e24">DLQ consumer →</text>
    <text x="490" y="689" text-anchor="middle" font-size="12" fill="#1b1e24">Postgres: dlq_events</text>

    <line x1="490" y1="588" x2="490" y2="645" stroke="#1b1e24" stroke-width="1.4" marker-end="url(#arrow)"></line>
    <text x="500" y="620" font-family="system-ui, sans-serif" font-size="11" fill="#626a78">consume</text>

    <!-- Row 7: recovery -->
    <rect x="140" y="754" width="230" height="56" rx="10" fill="#ffffff" stroke="#1b1e24" stroke-width="1.4"></rect>
    <text x="255" y="787" text-anchor="middle" font-size="12" font-weight="600" fill="#1b1e24">POST /dlq/{id}/replay</text>

    <rect x="570" y="754" width="280" height="56" rx="10" fill="#ffffff" stroke="#1b1e24" stroke-width="1.4"></rect>
    <text x="710" y="779" text-anchor="middle" font-size="12" font-weight="600" fill="#1b1e24">GET /dlq/{id}/analysis</text>
    <text x="710" y="795" text-anchor="middle" font-size="12" fill="#1b1e24">→ Ollama → dlq_analysis</text>

    <path d="M420,704 L268,751" fill="none" stroke="#1b1e24" stroke-width="1.4" marker-end="url(#arrow)"></path>
    <text x="310" y="733" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#626a78">operator</text>

    <path d="M560,704 L700,751" fill="none" stroke="#1b1e24" stroke-width="1.4" marker-end="url(#arrow)"></path>
    <text x="660" y="733" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#626a78">diagnose</text>
  </g>
</svg>
